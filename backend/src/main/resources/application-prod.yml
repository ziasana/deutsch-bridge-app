spring:
  # Production email via Gmail SMTP. MAIL_USERNAME must be a full Gmail address and
  # MAIL_PASSWORD must be a 16-character Google App Password (not the account password) -
  # generate one at https://myaccount.google.com/apppasswords (requires 2-Step Verification).
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          ssl:
            trust: ${MAIL_HOST:smtp.gmail.com}
