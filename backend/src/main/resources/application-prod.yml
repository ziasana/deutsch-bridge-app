spring:
  # Production email via an SMTP relay. Defaults to Brevo (smtp-relay.brevo.com:2525) because
  # Render's free tier blocks outbound ports 25/465/587 - 2525 is the one submission port it
  # doesn't block. Gmail SMTP only supports 25/465/587, so it can't be reached from a Render
  # free instance regardless of credentials; switch host/port back to smtp.gmail.com:587 via
  # env vars if you're on a paid Render plan (or any host that doesn't block SMTP) instead.
  mail:
    host: ${MAIL_HOST:smtp-relay.brevo.com}
    port: ${MAIL_PORT:2525}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          ssl:
            trust: ${MAIL_HOST:smtp-relay.brevo.com}
