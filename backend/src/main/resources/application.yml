spring:
  application:
    name: deutschbridge-backend

  #Email configuration
  mail:
    host: localhost
    port: 1025
    username: aliemran2022@gmail.com
    password:
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

  lifecycle:
    timeout-per-shutdown-phase: 20s

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB


    #Postgresql setting
  datasource:
    url: ${POSTGRES_URI}
    hikari:
      data-source-properties:
        reWriteBatchedInserts: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1


  ai:
    ollama:
      chat:
        options:
          model: gemma3:1b


  #MongoDB settings
  data:
    mongodb:
      uri: ${MONGODB_URI}


  #JPA and Hibernate settings
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true

ollama:
  api:
    key: ${OLLAMA_API_KEY}
    url: ${OLLAMA_API_URI}

logging:
  level:
    org:
      springframework:
        web:
          client:
            RestTemplate: DEBUG


server:
  shutdown: graceful

jwt:
  secret: ${JWT_SECRET}
  expiration:
    access-token: 900000          # 15 minutes in ms (1000*60*15)
    refresh-token: 1296000000     # 15 days in ms (1000*60*60*24*15)
    verification-token: 86400000  # 1 day in ms (1000*60*60*24)

frontend_url: ${FRONTEND_URI}

notifications:
  scheduler:
    enabled: true
    sweep-interval-ms: 900000              # evaluate learners every 15 minutes
    reminder-cron: "0 */5 * * * *"          # check for reached preferred reminder times
    reminder-window-seconds: 300
  broadcast-scheduler:
    dispatch-interval-ms: 60000            # check for due admin broadcasts every minute

app:
  upload:
    dir: ${UPLOAD_DIR:uploads}
