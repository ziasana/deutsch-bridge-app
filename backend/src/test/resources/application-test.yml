spring:
  datasource:
    url: jdbc:tc:postgresql:15:///testdb
    username: testuser
    password: testpass
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver

  jpa:
    hibernate:
      ddl-auto: update

  # Each test run gets a brand-new, empty Testcontainers database with no pre-existing schema for
  # Flyway to baseline against (see V1__baseline.sql's comment) - ddl-auto=update above builds the
  # whole schema fresh every run instead, same as it always has for tests.
  flyway:
    enabled: false

  testcontainers:
    reuse:
      enable: true

  data:
    mongodb:
      database: testdb
      port: 0

  # data:
 #   mongodb:
 #     database: test
 #     connect-timeout: 30000 # 30 seconds
 #     socket-timeout: 60000  # 60 seconds

